[package]
name = "aws_pdf_search"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37"
pdf_oxide = "0.3"
tantivy = "0.27"
lindera = "7.0"
lindera-tantivy = "7.0"
lindera-dictionary = "7.0"
rfd = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.12"
regex = "1.13"
unicode-normalization = "0.1"

[build-dependencies]
lindera-dictionary = "7.0"

[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
